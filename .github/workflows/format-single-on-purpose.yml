name: Format Single on Purpose

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Polish Korean Quarto
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('mybook/single-on-purpose/index.qmd')
          s = p.read_text()

          # Metadata
          front = s.split('---', 2)[1]
          if '\nlang:' not in front:
              s = s.replace('date: "2020-11-11"\n---', 'date: "2020-11-11"\nlang: ko\n---', 1)

          # Conservative natural-Korean cleanup of clear translation/spacing artifacts.
          repl = {
              '파 묻혀': '파묻혀', '확신히': '확실히', '덪니까': '덥니까',
              '좋는지': '좋은지', '대화은': '대화는', '좋는': '좋은',
              '대해졌으면': '대해 주었으면', '맞하니': '맞으니',
              '강요당는': '강요당하는', '차안': '차 안', '집밖': '집 밖',
              '집밖에': '집 밖에', '그게 대수였냐요': '그게 무슨 소용이었겠어요',
              '인생 최저점': '인생의 최저점', '그런급박감을': '그런 급박감을',
              '쫓아다니기가': '쫓아다니기가', '알려주': '알려 주',
              '도와주': '도와 주', '만들어주': '만들어 주', '돌려주': '돌려 주',
              '찾아주': '찾아 주', '보여주': '보여 주', '생각해볼': '생각해 볼',
              '기분들게': '기분 들게', '전아니면 전부': '전부 아니면 전무',
              '전아니면 전부(all-or-nothing)': '전부 아니면 전무(all-or-nothing)',
              '끈적한 공의존적': '끈적하고 공의존적인',
              '옛것을 가려버리고': '옛것을 가려 버리고',
              '마무리 안 된': '마무리되지 않은', '안 해요': '하지 않아요',
              '못 합니다': '못 합니다', '못해요': '못 해요',
              '어떻게 더 잘하기': '더 잘하는 법',
              '시간 기계에 사는 법 멈추기': '시간 기계에서 빠져나오는 법',
              '생각에 블랙라이트를 비춰라': '생각에 블랙라이트를 비춰 보라',
              '생각을 심문해라': '생각을 심문해 보라',
              '생각 속 반복 패턴을 알아차려라': '생각 속 반복 패턴을 알아차려 보라',
              '설계도를 찢어라': '설계도를 찢어 버려라',
          }
          for a,b in repl.items(): s = s.replace(a,b)

          # Normalize standalone bold labels into Markdown headings.
          out=[]
          for line in s.splitlines():
              m=re.fullmatch(r'\*\*([^*]+)\*\*', line.strip())
              if m and not m.group(1).startswith(('JOHN','CHRISTY','MOM','DAD','AMANDA','LOS ANGELES')):
                  text=m.group(1).strip()
                  if text not in {'하루. 하루. 매일.', '당신을 위해 춤춰라, 그러면 다른 사람들이 당신과 함께 춤출 것이다. 남을 위해 춤추면 당신은 쇼가 된다. 사람이 아니라.'}:
                      line='## '+text
              if line.strip()=='***': line='---'
              out.append(line)
          s='\n'.join(out).rstrip()+'\n'

          # Highlight the book's recurring takeaways with Quarto callouts.
          for marker, kind, title in [
              ('**성장의 가장 비옥한 흙은 솔로일 때 가꾸어진다**','note','핵심 메시지'),
              ('**솔로후드는 단순히 혼자 있는 것만이 아닙니다. 온전한 사람이 되는 것입니다.**','important','이 책의 핵심'),
              ('**사랑과 연애는 당신 삶의 한 부분일 뿐, 전부가 아닙니다.**','note','기억할 것'),
              ('**가치는 짓는 겁니다.**','important','핵심 원칙'),
              ('**하루. 하루. 매일.**','tip','매일 기억할 것'),
          ]:
              if marker in s:
                  s=s.replace(marker, f'::: {{.callout-{kind} title="{title}"}}\n\n{marker}\n\n:::', 1)

          p.write_text(s)
          PY
      - name: Commit formatted document
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mybook/single-on-purpose/index.qmd
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'docs: 자연스러운 한국어와 Quarto 서식 정리'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
