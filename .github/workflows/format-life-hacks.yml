name: Polish life hacks document

on:
  push:
    branches:
      - docs/life-hacks-korean-quarto

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Polish Korean QMD and add Quarto callouts
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("mybook/life-hacks/index.qmd")
          text = path.read_text(encoding="utf-8")

          # Make the terminology consistent and replace frequent machine-translation artifacts.
          replacements = {
              "인생 해크": "라이프핵",
              "인생 해킹": "라이프핵",
              "생명 해킹": "라이프핵",
              "생활 해킹": "라이프핵",
              "라이프 해크": "라이프핵",
              "라이프 해킹": "라이프핵",
              "인생 핵": "라이프핵",
              "꿀팁": "생활 꿀팁",
              "해킹": "꿀팁",
              "작업을 수행하십시오": "작업하세요",
              "작업을 수행하세요": "작업하세요",
              "확인하십시오": "확인하세요",
              "사용하십시오": "사용하세요",
              "시도하십시오": "시도해 보세요",
              "알려주십시오": "알려주세요",
              "말하십시오": "말해 보세요",
              "하십시오": "하세요",
              "하실 수 있습니다": "할 수 있습니다",
              "하실 수": "할 수",
              "여러분의 삶": "일상",
              "일상 생활": "일상생활",
              "그렇습니다": "그렇습니다",
              "그럼 다음은 뭐야?": "그렇다면 집에서는 어떻게 활용할 수 있을까요?",
              "무엇을 해야 하는지": "무엇을 해야 할지",
              "할 수 있는 방법이 있습니다": "방법이 있습니다",
              "매우 어려운 일이 될 수 있습니다": "꽤 번거로운 일입니다",
              "정말 어려울 수 있습니다": "상당히 번거로울 수 있습니다",
              "놀라운 일을 합니다": "효과가 좋습니다",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          # Add useful Quarto metadata while preserving the existing front matter.
          if "lang: ko" not in text.split("---", 2)[1]:
              text = text.replace('date: "2015-11-02"\n---', 'date: "2015-11-02"\nlang: ko\n---', 1)

          # Make the opening more readable and visually distinct.
          intro_marker = "# 들어가며\n\n"
          intro_callout = (
              "# 들어가며\n\n"
              "> 라이프핵은 거창한 비법이 아니라, 일상에서 반복되는 작은 불편을 더 간단하게 해결하는 방법입니다.\n\n"
              "::: {.callout-note title=\"읽는 법\"}\n"
              "이 책의 팁은 모두 그대로 따라 하기보다 자신의 환경에 맞는 것만 골라 활용하세요. 특히 건강·안전·기기 설정과 관련된 내용은 현재의 제품 설명서와 공식 안내를 먼저 확인하는 것이 좋습니다.\n"
              ":::\n\n"
          )
          if intro_marker in text and "title=\"읽는 법\"" not in text:
              text = text.replace(intro_marker, intro_callout, 1)

          # Turn simple one-paragraph second-level tips into compact Quarto callouts.
          # Longer sections remain normal headings so the table of contents stays useful.
          lines = text.splitlines()
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.startswith("## ") and i + 2 < len(lines):
                  title = line[3:].strip()
                  j = i + 1
                  while j < len(lines) and not lines[j].strip():
                      j += 1
                  k = j
                  while k < len(lines) and not lines[k].startswith("# ") and not lines[k].startswith("## ") and not lines[k].startswith("### "):
                      k += 1
                  body = lines[j:k]
                  nonempty = [x for x in body if x.strip()]
                  if nonempty and len(nonempty) <= 2 and not any(x.lstrip().startswith(("1. ", "2. ", "- ", "* ")) for x in nonempty):
                      out.append(f"::: {{.callout-tip title=\"{title}\"}}")
                      out.extend(body)
                      out.append(":::")
                      out.append("")
                      i = k
                      continue
              out.append(line)
              i += 1
          text = "\n".join(out).rstrip() + "\n"

          # Add a short navigation callout before the large thematic chapters.
          thematic_titles = {
              "# 생산성을 높여주는 라이프핵": "집중력을 높이고 미루는 습관을 줄이는 방법을 모았습니다.",
              "# 건강을 위한 라이프핵": "가벼운 일상 건강 팁을 다룹니다. 의학적 증상이 있다면 전문적인 진료를 우선하세요.",
              "# 직장 생활을 위한 해크": "업무 환경과 디지털 기기를 조금 더 편리하게 쓰는 방법입니다.",
              "# 정리 정돈의 기술": "물건을 찾는 시간을 줄이고 공간을 효율적으로 사용하는 방법입니다.",
              "# 가정을 위한 라이프핵": "집 안에서 반복되는 청소와 정리의 수고를 덜어주는 아이디어입니다.",
              "# 절약과 재테크 해크": "지출을 관리하고 돈을 아끼는 기본적인 생활 습관을 정리했습니다.",
              "# 시간을 아껴주는 꿀팁": "시간을 낭비하는 지점을 찾고 하루의 흐름을 단순하게 만드는 방법입니다.",
          }
          for heading, description in thematic_titles.items():
              if heading in text and f"title=\"{heading[2:]}\"" not in text:
                  text = text.replace(
                      heading + "\n",
                      heading + "\n\n" + f"::: {{.callout-note title=\"이 장의 핵심\"}}\n{description}\n:::\n",
                      1,
                  )

          path.write_text(text, encoding="utf-8")

      - name: Commit document changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-life-hacks.yml
          git add mybook/life-hacks/index.qmd
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: polish life hacks Korean and Quarto formatting"
          git push