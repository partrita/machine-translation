name: Format Shortness of Life

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'docs/shortness-of-life-korean-quarto'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/shortness-of-life-korean-quarto
          fetch-depth: 0

      - name: Improve Korean prose and Quarto formatting
        shell: python
        run: |
          from pathlib import Path

          path = Path("mybook/shortness-of-life/index.qmd")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "하십시오": "하세요",
              "하실 수 있습니다": "할 수 있습니다",
              "할 수 있도록 하십시오": "할 수 있도록 하세요",
              "확인하십시오": "확인하세요",
              "사용하십시오": "사용하세요",
              "시도하십시오": "시도해 보세요",
              "생각하십시오": "생각해 보세요",
              "기억하십시오": "기억해 두세요",
              "선택하십시오": "선택하세요",
              "시작하십시오": "시작해 보세요",
              "실천하십시오": "실천해 보세요",
              "적용하십시오": "적용해 보세요",
              "정리하십시오": "정리하세요",
              "제거하십시오": "제거하세요",
              "버리십시오": "버리세요",
              "비우십시오": "비워 보세요",
              "줄이십시오": "줄여 보세요",
              "늘리십시오": "늘려 보세요",
              "해 보십시오": "해 보세요",
              "살펴보십시오": "살펴보세요",
              "알아보십시오": "알아보세요",
              "따르십시오": "따라 보세요",
              "유지하십시오": "유지하세요",
              "노력하십시오": "노력해 보세요",
              "권장합니다": "권합니다",
              "~하는 것이 좋습니다": "~해 보는 것이 좋습니다",
              "더욱": "더",
              "매우": "아주",
              "통해": "통해서",
              "그렇기 때문에": "그래서",
              "이러한": "이런",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          if "lang: ko" not in text:
              text = text.replace('date: 2026-08-24\n', 'date: 2026-08-24\nlang: ko\n', 1)

          marker = "# 인생의 짧음에 대하여\n"
          intro = '''# 인생의 짧음에 대하여\n\n::: {.callout-note title="이 글의 핵심"}\n세네카가 말하는 삶의 짧음은 주어진 수명의 길이가 아니라 **우리가 시간을 어떻게 사용하는가**에 관한 문제입니다. 바쁘게 사느라 현재를 잃기보다, 자신의 시간을 의식적으로 살아가는 것이 이 글의 중심 주제입니다.\n:::\n'''
          if marker in text and "이 글의 핵심" not in text:
              text = text.replace(marker, intro, 1)

          callouts = {
              "# 헬비아를 위로하며": '''# 헬비아를 위로하며\n\n::: {.callout-important title="이 장의 주제"}\n상실과 불행 앞에서 슬픔을 억누르는 대신, 그것을 정면으로 바라보고 견뎌 내는 힘을 이야기합니다.\n:::\n''',
          }
          for heading, replacement in callouts.items():
              if heading in text and replacement not in text:
                  text = text.replace(heading, replacement, 1)

          thesis = "우리에게 살 시간이 부족한 것이 아니라, 우리가 너무 많이 낭비하는 것입니다."
          if thesis in text and "세네카의 핵심 주장" not in text:
              text = text.replace(
                  thesis,
                  '''::: {.callout-tip title="세네카의 핵심 주장"}\n**우리에게 살 시간이 부족한 것이 아니라, 우리가 너무 많이 낭비하는 것입니다.**\n\n삶은 충분히 길며, 잘 사용한다면 중요한 일을 이루기에 넉넉합니다.\n:::\n''',
                  1,
              )

          path.write_text(text, encoding="utf-8")

      - name: Commit document changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mybook/shortness-of-life/index.qmd
          git diff --cached --quiet || git commit -m "docs: 짧은 인생에 대하여 한국어 문체와 Quarto 서식 개선"
          git push origin HEAD:docs/shortness-of-life-korean-quarto

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/format-shortness-of-life.yml
          git commit -m "chore: 임시 문서 서식 작업 흐름 제거"
          git push origin HEAD:docs/shortness-of-life-korean-quarto
