name: Format One Minute Manager

on:
  push:
    branches: [docs/one-minute-manager-korean-quarto]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Improve Korean and Quarto formatting
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("mybook/one-minute-manager/index.qmd")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "원 미닛 매니저별": "원 미닛 매니저는",
              "원 미닛 경영": "원 미닛 매니지먼트",
              "매니저라고는 하셨지만": "매니저라고 하셨지만",
              "~하실 수 있습니다": "~할 수 있습니다",
              "하실 수 있습니다": "할 수 있습니다",
              "알려드리겠습니다": "알려 드리겠습니다",
              "알려주었습니다": "알려 주었습니다",
              "보여주었습니다": "보여 주었습니다",
              "말해주었습니다": "말해 주었습니다",
              "말해주지": "말해 주지",
              "말해줬": "말해 줬",
              "도와드릴까요": "도와드릴까요",
              "무엇을 도와드릴까요?": "무엇을 도와드릴까요?",
              "그러므로": "따라서",
              "그럼": "그렇다면",
              "그렇지요": "그렇죠",
              "아니요!": "아닙니다!",
              "물론이지요": "물론입니다",
              "우기듯 말했습니다": "단호하게 말했습니다",
              "파고들었습니다": "거듭 물었습니다",
              "자발적으로 말했습니다": "불쑥 말했습니다",
              "검지를 들었습니다": "손가락을 들어 올렸습니다",
          }
          for a, b in replacements.items():
              text = text.replace(a, b)

          # Fix a few obvious OCR/translation artifacts where punctuation was lost.
          text = text.replace("사무실창이", "사무실. 창이")
          text = text.replace("사무실이 없었습니다", "사무실이 없었습니다.")
          text = re.sub(r'(?<![.!?])\\s+"', ' "', text)

          # Add Korean document language metadata.
          if "lang:" not in text.split("---", 2)[1]:
              text = text.replace('---\ntitle:', '---\nlang: ko\ntitle:', 1)

          # Add a concise Quarto callout after the front matter.
          parts = text.split("---", 2)
          if len(parts) == 3 and "읽는 법" not in parts[2][:700]:
              intro = '''\n\n::: {.callout-note title="이 책의 핵심"}\n『1분 매니저』가 말하는 핵심은 복잡한 관리 기법이 아닙니다. **목표를 명확하게 정하고, 성과를 인정하고, 필요할 때는 짧고 구체적으로 바로잡는 것**입니다. 이 세 가지 원칙을 일상적인 관리에 적용해 보세요.\n:::\n'''
              text = parts[0] + "---" + parts[1] + "---" + intro + parts[2]

          # Turn the three core techniques into visually distinct callouts.
          for heading, title, kind in [
              ("## 첫 번째 비밀: 원 미닛 목표 설정", "첫 번째 비밀: 원 미닛 목표 설정", "callout-tip"),
              ("## 두 번째 비밀: 원 미닛 칭찬", "두 번째 비밀: 원 미닛 칭찬", "callout-tip"),
              ("## 세 번째 비밀: 원 미닛 재지시", "세 번째 비밀: 원 미닛 재지시", "callout-important"),
          ]:
              text = text.replace(heading, f'## {title}\n\n::: {{.{kind} title="{title}"}}', 1)
              # Close before the next H2 section, preserving headings.
              start = text.find(f'## {title}\n\n::: {{.{kind} title="{title}"}}')
              if start >= 0:
                  nxt = text.find('\n## ', start + 10)
                  if nxt >= 0 and '\n:::\n' not in text[start:nxt]:
                      text = text[:nxt].rstrip() + '\n\n:::\n' + text[nxt:]

          # Highlight the book's central principle where it appears as a standalone blockquote.
          text = text.replace('> *자기 자신에 대한 기분이 좋은*\n> *사람들은*\n> *좋은 결과를 만들어 낸다*',
                                '> **자기 자신에 대해 좋은 기분을 느끼는 사람은 좋은 결과를 만들어 냅니다.**')

          path.write_text(text, encoding="utf-8")
      - name: Remove temporary workflow and commit document
        run: |
          rm -f .github/workflows/format-one-minute-manager.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mybook/one-minute-manager/index.qmd
          git rm -f .github/workflows/format-one-minute-manager.yml || true
          git diff --cached --quiet || git commit -m "docs: 1분 매니저 한국어 문장과 Quarto 서식 개선"
          git push
