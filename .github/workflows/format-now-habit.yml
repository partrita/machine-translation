name: Format now habit
on:
  push:
    branches: [docs/now-habit-korean-quarto]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format Korean QMD
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('mybook/now-habit/index.qmd')
          text=path.read_text(encoding='utf-8')
          if not re.search(r'^lang:\s*ko\s*$',text,re.M):
              text=text.replace('---\ntitle:','---\nlang: ko\ntitle:',1)
          headings={
            'INTRODUCTION':'들어가며','FROM PROCRASTINATOR TO PRODUCER':'미루는 사람에서 생산자로','A NEW DEFINITION OF PROCRASTINATION':'미루기에 대한 새로운 정의','THE NOW HABIT':'지금 습관','WHY WE PROCRASTINATE':'1장. 우리는 왜 미루는가','HOW WE PROCRASTINATE':'2장. 우리는 어떻게 미루는가','HOW TO TALK TO YOURSELF':'3장. 자신에게 어떻게 말할 것인가','GUILT-FREE PLAY, QUALITY WORK':'4장. 죄책감 없는 놀이와 양질의 일','OVERCOMING BLOCKS TO ACTION':'5장. 행동을 가로막는 장애물 넘기','THE UNSCHEDULE':'6장. 언스케줄','WORKING IN THE FLOW STATE':'7장. 몰입 상태에서 일하기','FINE-TUNING YOUR PROGRESS':'8장. 발전 과정 다듬기','THE PROCRASTINATOR IN YOUR LIFE':'9장. 내 주변의 미루는 사람','BIBLIOGRAPHY':'참고문헌','ABOUT THE AUTHOR':'저자 소개',
            'WARNING SIGNS OF PROCRASTINATION':'미루기의 경고 신호','A POSITIVE VIEW OF THE HUMAN SPIRIT':'인간 정신에 대한 긍정적 관점','OUR WORST CRITIC: OURSELVES':'가장 가혹한 비판자는 바로 우리 자신','PROCRASTINATION IS REWARDING':'미루기는 보상을 준다','KNOWING HOW YOU SPEND YOUR TIME':'시간을 어떻게 쓰는지 파악하기','THE PROCRASTINATION LOG':'미루기 기록표','CREATING SAFETY: THE FIRST MAJOR STEP OUT OF PROCRASTINATION':'안전감 만들기: 미루기에서 벗어나는 첫걸음','COUNTERPRODUCTIVE MESSAGES':'역효과를 내는 메시지','THE POWER OF CHOICE':'선택의 힘','FIVE SELF-STATEMENTS THAT DISTINGUISH PROCRASTINATORS FROM PRODUCERS':'미루는 사람과 생산자를 가르는 다섯 가지 자기 대화','THE IMPORTANCE OF PLAY':'놀이의 중요성','THE PULL METHOD OF SELF-MOTIVATION':'자기 동기를 끌어당기는 방식','FROM GUILT-FREE PLAY TO QUALITY WORK':'죄책감 없는 놀이에서 양질의 일로','THREE MAJOR BLOCKS':'세 가지 주요 장애물','TOOL #1: THREE-DIMENSIONAL THINKING AND THE REVERSE CALENDAR':'도구 1: 입체적 사고와 역산 일정표','TOOL #2: THE WORK OF WORRYING':'도구 2: 걱정을 일로 바꾸기','TOOL #3: PERSISTENT STARTING':'도구 3: 끈기 있게 시작하기','EVEN PRODUCERS NEED A SYSTEM':'생산자에게도 시스템이 필요하다','REVERSE PSYCHOLOGY':'역심리학','HOW TO USE THE UNSCHEDULE':'언스케줄 사용법','ADJUSTING YOUR UNSCHEDULE':'언스케줄 조정하기','USING MORE OF YOUR BRAIN':'뇌를 더 많이 활용하기',"IT'S ONLY YOUR FIRST DRAFT":'아직 첫 번째 초안일 뿐이다','LEARNING TO FOCUS':'집중하는 법 배우기','FOCUSING EXERCISE':'집중 훈련','RELAXATION EXERCISE':'이완 훈련','INCORPORATING FLOW STATES INTO YOUR PROGRAM':'프로그램에 몰입 상태 통합하기','PLANNED SETBACKS':'계획된 좌절','RESILIENCE AND HARDINESS':'회복탄력성과 강인함','CONCENTRATION: CONTROLLING DISTRACTIONS':'집중력: 방해 요소 통제하기','MENTAL REHEARSAL AND PREPROGRAMMING':'정신적 리허설과 사전 프로그래밍','EFFECTIVE GOAL-SETTING':'효과적인 목표 설정','MANAGING PEOPLE WHO PROCRASTINATE':'미루는 사람 관리하기','COMMITMENT VS. COMPLIANCE':'헌신과 순응의 차이','FOCUSING ON STARTING VS. FINISHING':'완료보다 시작에 집중하기','GETTING RESULTS OR GIVING CRITICISM':'결과를 얻는 것과 비판하는 것','LIVING WITH A PROCRASTINATOR':'미루는 사람과 함께 살아가기','A LAST WORD':'맺음말',
            'PROCRASTINATION AND ANXIETY WORK IN FIVE STAGES':'미루기와 불안이 작동하는 다섯 단계','A SUPPORT SYSTEM':'안전망 만들기','DEVELOPING POSITIVE SELF-TALK':'긍정적인 자기 대화 기르기','THE ROAD BACK TO HEALTH':'건강을 되찾는 길','THE “HAVE TO’S”—MESSAGES OF STRESS':'“해야 한다”는 말이 만드는 스트레스','THE “SHOULD’S”—MESSAGES OF DEPRESSION':'“해야 한다”는 말이 만드는 우울','LEARNING HOW TO SAY NO':'거절하는 법 배우기','UNDERSTANDING PROCRASTINATION':'미루기 이해하기','TIME AWARENESS':'시간 인식','SETTING PRIORITIES':'우선순위 정하기','FRAN’S SCHEDULE EXAMPLE':'프랜의 일정 사례','PROCRASTINATION PATTERNS':'미루기 패턴'
          }
          chapter_keys={'INTRODUCTION','FROM PROCRASTINATOR TO PRODUCER','A NEW DEFINITION OF PROCRASTINATION','THE NOW HABIT','WHY WE PROCRASTINATE','HOW WE PROCRASTINATE','HOW TO TALK TO YOURSELF','GUILT-FREE PLAY, QUALITY WORK','OVERCOMING BLOCKS TO ACTION','THE UNSCHEDULE','WORKING IN THE FLOW STATE','FINE-TUNING YOUR PROGRESS','THE PROCRASTINATOR IN YOUR LIFE','BIBLIOGRAPHY','ABOUT THE AUTHOR'}
          out=[]
          for line in text.splitlines():
              m=re.match(r'^(#{1,6})\s+(.+?)\s*$',line)
              if m:
                  raw=m.group(2).strip(); title=headings.get(raw.upper(),raw)
                  line='#'*(1 if raw.upper() in chapter_keys else 2)+' '+title
              out.append(line)
          text='\n'.join(out)+'\n'
          text=text.replace('\n***\n','\n---\n')
          text=re.sub(r'(?m)^(\s*)[\*-]\s+',lambda m:'  '*(len(m.group(1).expandtabs(2))//2)+'- ',text)
          marker='*미루기란 과제나 결정을 시작하거나 완수하는 데 따르는 불안에 대처하기 위한 메커니즘이다.*'
          if marker in text and 'callout-note' not in text:
              text=text.replace(marker,'::: {.callout-note}\n## 미루기의 새로운 정의\n\n'+marker+'\n\n이 정의는 미루기를 게으름의 문제가 아니라 불안을 다루기 위한 대처 방식으로 바라보게 합니다.\n:::',1)
          heading='## 미루는 사람과 생산자를 가르는 다섯 가지 자기 대화'
          if heading in text and 'callout-tip' not in text:
              text=text.replace(heading,'::: {.callout-tip}\n## 미루는 사람에서 생산자로 바꾸는 다섯 가지 자기 대화\n\n생산자는 의무와 압박 대신 선택과 시작, 작은 진전, 인간적인 완벽함, 죄책감 없는 놀이에 초점을 둡니다.\n:::',1)
          path.write_text(text,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mybook/now-habit/index.qmd
          git diff --cached --quiet && exit 0
          git commit -m 'docs: 지금 습관 한국어와 Quarto 서식 개선'
          git push
